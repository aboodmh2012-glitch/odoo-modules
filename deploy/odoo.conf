[options]
; Persistent filestore / sessions (mounted Railway volume)
data_dir = /var/lib/odoo
; Core + Symbifox extra addons baked into the image at build time
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
http_port = 8069
gevent_port = 8072
proxy_mode = True
list_db = True
db_maxconn = 64
without_demo = all
; DB host/user/password are supplied by the official entrypoint from env:
; HOST, PORT, USER, PASSWORD (Railway Postgres reference variables)
