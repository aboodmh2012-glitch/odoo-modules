<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MASAR Theme Responsive Preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf0f4; color: #071f3d; font: 14px system-ui, sans-serif; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 20px; background: #071f3d; color: white; }
    h1 { font-size: 16px; margin: 0 16px 0 0; }
    label { display: flex; align-items: center; gap: 6px; }
    select, button { min-height: 36px; border: 1px solid #ccd4df; border-radius: 6px; padding: 6px 10px; background: white; color: #071f3d; }
    button { background: #ff6a00; border-color: #ff6a00; font-weight: 600; cursor: pointer; }
    #stage { display: flex; justify-content: center; padding: 16px; overflow: auto; }
    iframe { flex: none; background: white; border: 1px solid #bac5d2; border-radius: 12px; box-shadow: 0 12px 32px #071f3d1a; width: 390px; height: 780px; }
    #status { font-size: 12px; margin: 0; opacity: .85; }
  </style>
</head>
<body>
  <header>
    <h1>MASAR Theme Preview</h1>
    <label>Page <select id="page"><option value="/web/login">Login</option><option value="/ar/web/login">Arabic login</option><option value="/web/reset_password">Reset password</option><option value="/web/signup">Sign up</option></select></label>
    <label>Viewport <select id="size"><option value="390,780">Phone 390 × 780</option><option value="320,568">Small phone 320 × 568</option><option value="844,390">Phone landscape 844 × 390</option><option value="820,1180">Tablet 820 × 1180</option><option value="1280,768">Desktop 1280 × 768</option></select></label>
    <button id="reload" type="button">Reload preview</button>
    <p id="status">Authentication preview. Administration keeps its normal frame restrictions.</p>
  </header>
  <main id="stage"><iframe id="preview" title="MASAR responsive preview" src="/web/login"></iframe></main>
  <script>
    // Manual regression fixture. No credentials, tracking, or stored settings.
    const frame = document.getElementById('preview');
    const pages = document.getElementById('page');
    const sizes = document.getElementById('size');
    function navigate() { frame.src = pages.value; }
    pages.addEventListener('change', navigate);
    sizes.addEventListener('change', () => {
      const [width, height] = sizes.value.split(',');
      frame.style.width = width + 'px';
      frame.style.height = height + 'px';
    });
    document.getElementById('reload').addEventListener('click', navigate);
  </script>
</body>
</html>
